plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.suhoi'
version = '0.0.1-SNAPSHOT'
description = 'mexc-websocket'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    // Telegram long polling (стабильная ветка 6.9.x)
    implementation 'org.telegram:telegrambots:6.9.7.1'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:3.25.3" }
    generatedFilesBaseDir = "$projectDir/build/generated"
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { option 'lite' } } // если положишь .proto — сгенерятся легковесные классы
        }
    }
}

sourceSets {
    main {
        resources { exclude '**/*.proto' }
        proto { srcDir 'src/main/proto' } // если добавишь .proto из mexcdevelop/websocket-proto
        java { srcDirs += ["$projectDir/build/generated/source/proto/main/java"] }
    }
}
tasks.withType(ProcessResources).configureEach {
    // на всякий случай — если где-то всё же встретятся одноимённые файлы
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}